[tool.poetry]
name = "pinn-automation"
version = "0.1.0"
description = "Physics-Informed Neural Network Pipeline for Landslide Deformation Prediction"
authors = ["Julia"]
readme = "README.md"
packages = [{include = "models"}, {include = "data_pipeline"}, {include = "training"}, {include = "visualization"}, {include = "analysis"}]

[tool.poetry.dependencies]
python = "^3.10"

# Data processing
pandas = "^2.0.0"
numpy = "^1.24.0"
geopandas = "^0.14.0"
scipy = "^1.11.0"

# Machine Learning
scikit-learn = "^1.3.0"
torch = {version = "^2.0.0", source = "pytorch"}
optuna = "^3.4.0"

# Visualization
matplotlib = "^3.8.0"

# Configuration
pyyaml = "^6.0"

# Google Earth Engine (optional, for rainfall extraction)
earthengine-api = {version = "^0.1.380", optional = true}

[tool.poetry.extras]
gee = ["earthengine-api"]

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.scripts]
pinn-train = "run_pipeline:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
jupyter = "^1.0.0"
ipykernel = "^6.25.0"
