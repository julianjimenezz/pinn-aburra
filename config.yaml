# Input: Single CSV file (each CSV = one landslide area)
data:
  csv_path: 'C:\Users\julia\MGEO\THESIS\DEFORMATION_DATA\culstered_landslides_forNN_withRainfall\SanCristobalNorte1_with_rainfall.csv'
  feature_cols: ['u', 'X', 'Y', 'p_acum_30d', 'p_acum_60d', 'p_acum_90d', 't_days']
  target_col: 'u'

# Data Split (temporal-based)
split:
  temporal_cutoff_train: 600    # Train: days <= 600
  temporal_cutoff_val: 750      # Val: days 600-750, Test: > 750

# Sequence Parameters
sequence:
  n_steps_in: 10
  n_steps_out: 1

# GRU Hyperparameters
gru:
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  learning_rate: 0.001
  batch_size: 64

# LSTM Hyperparameters
lstm:
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  learning_rate: 0.001
  batch_size: 64

# Physics (Perzyna viscoplastic model)
physics:
  h: 15.0              # depth (m)
  tau_fixed: 100.0      # shear stress (kPa)
  sigma_0: 100.0         # normalization (kPa)
  dt_days: 12.0        # time step
  lambda_phy: 10000     # physics loss weight (reduced from 1e8 for stability)

  # Initial parameter guesses (prevents division by zero / exploding loss)
  initial_params:
    eta: 200000.0      # start with high viscosity = low strain rate
    c_prime: 16.7
    phi: 26.8
    n: 2.0
    sigma_n: 50.0
    h: 10.0
    tau: 100.0

  # Trainable flag for each parameter. True = learned by optimizer, False = fixed at initial value
  trainable:
    eta: true
    c_prime: false
    phi: false
    n: true
    sigma_n: true
    h: true
    tau: true
    
  # Bounds for parameters [min, max]. Used to constrain the optimizer.
  bounds:
    c_prime: [0.1, 25.0]
    phi: [0.1, 30.0]
    n: [1.1, 5.0]
    sigma_n: [10.0, 200.0]
    eta: [10000.0, 5000000.0]
    h: [5.0, 20.0]
    tau: [10.0, 500.0]

# Training
training:
  model_type: "gru"    # or "lstm"
  epochs: 100
  early_stopping_patience: 15
  seed: 42

# Checkpointing
checkpointing:
  save_best_val: true
  save_best_physics_balance: true
  save_every_n_epochs: 10
  save_best_total: true

# Hyperparameter Tuning
tuning:
  enabled: false
  n_trials: 50
  gru_search_space:
    hidden_size: [64, 128, 256]
    num_layers: [1, 2, 3]
    dropout: [0.1, 0.5]
    learning_rate: [0.0001, 0.01]
  lstm_search_space:
    hidden_size: [64, 128, 256]
    num_layers: [1, 2, 3]
    dropout: [0.1, 0.5]
    learning_rate: [0.0001, 0.01]

# Sensitivity Analysis
sensitivity:
  enabled: true
  n_samples: 20
  parameters:
    c_prime: [5.0, 25.0]
    phi: [15.0, 45.0]
    n_exp: [1.0, 5.0]
    sigma_n: [10.0, 100.0]
    eta: [100.0, 10000.0]

# Multi-Start Analysis (Random Initialization Ranges)
multi_start:
  ranges:
    c_prime: [2.0, 15.0]     # kPa
    phi: [10.0, 35.0]        # degrees
    n: [1.1, 4.0]            # exponent > 1
    sigma_n: [10.0, 50.0]    # kPa
    eta: [100000, 5000000]   # Viscosity (kPa·day)

# Output directories
output:
  models_dir: "outputs/models"
  results_dir: "outputs/results"
  figures_dir: "outputs/figures"

